<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eli — Gym Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0d0d;--s1:#1a1a1a;--s2:#242424;--s3:#2e2e2e;--border:#333;--text:#f0efed;--muted:#888;--green:#1D9E75;--blue:#4a90d9;--amber:#f0a030;--red:#e05050}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;min-height:100vh;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.top-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.prog-wrap{height:3px;background:var(--s3);position:sticky;top:49px;z-index:99}
.prog-fill{height:100%;background:var(--green);transition:width .4s ease}
.btn{display:block;width:100%;padding:14px 20px;border-radius:12px;border:none;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;transition:transform .1s}
.btn:active{transform:scale(0.97)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:8px 14px;font-size:0.82rem;border-radius:8px;display:inline-block;width:auto}
.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.day-btn{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .15s;text-align:left}
.day-btn:active{transform:scale(0.97)}
.day-btn.selected{border-color:var(--green);background:#1D9E7520}
.day-btn .day-letter{font-size:1.6rem;font-weight:700;line-height:1}
.day-btn .day-name{font-size:0.82rem;margin-top:4px;color:var(--muted)}
.day-btn .day-tag{font-size:0.68rem;margin-top:6px}
.week-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.week-pill{background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:0.82rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.week-pill.selected{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.88rem}
.hist-item:last-child{border:none}
.ex-header{padding:16px;border-bottom:1px solid var(--border)}
.ex-type-badge{display:inline-block;font-size:0.7rem;padding:3px 9px;border-radius:20px;font-weight:600;margin-bottom:8px}
.badge-compound{background:#1a1a1a;color:#ccc;border:1px solid #444}
.badge-iso{background:var(--s2);color:var(--muted);border:1px solid var(--border)}
.badge-rehab{background:#1D9E7520;color:var(--green);border:1px solid #1D9E7550}
.ex-name{font-size:1.3rem;font-weight:700;line-height:1.2;margin-bottom:6px}
.ex-target{font-size:0.88rem;color:var(--muted)}
.ex-target strong{color:var(--text)}
.rir-badge{display:inline-block;background:#1D9E7520;color:var(--green);font-size:0.75rem;padding:3px 9px;border-radius:20px;margin-left:8px;font-weight:600}

/* DEMO AREA */
.demo-area{position:relative;background:var(--s2);border-bottom:1px solid var(--border);overflow:hidden}
.demo-gif{width:100%;height:220px;object-fit:contain;display:block;background:var(--s2)}
.demo-svg-wrap{display:flex;align-items:center;justify-content:center;height:220px;background:linear-gradient(135deg,#111 0%,#1a1a1a 100%)}
.demo-svg-wrap svg{filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.demo-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;align-items:center;justify-content:space-between}
.muscle-tags{display:flex;flex-wrap:wrap;gap:4px}
.muscle-tag{font-size:0.68rem;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.yt-btn{display:inline-flex;align-items:center;gap:5px;background:#ff0000;border:none;border-radius:8px;padding:6px 10px;font-size:0.75rem;color:#fff;cursor:pointer;font-weight:600;text-decoration:none;flex-shrink:0}
.api-badge{position:absolute;top:10px;right:10px;font-size:0.65rem;padding:3px 7px;border-radius:8px;font-weight:600}
.api-badge.live{background:#1D9E7540;color:var(--green);border:1px solid var(--green)}
.api-badge.fallback{background:rgba(0,0,0,.5);color:var(--muted);border:1px solid var(--border)}

/* CUE */
.cue-box{margin:12px 16px;background:var(--s2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 12px;font-size:0.82rem;color:#ccc;line-height:1.6}

/* SET LOGGER */
.set-logger{padding:16px}
.set-row-header{display:grid;grid-template-columns:36px 1fr 1fr 76px;gap:8px;margin-bottom:8px;font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 76px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{width:32px;height:32px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:0.82rem;font-weight:600;color:var(--muted)}
.set-num.done{background:var(--green);color:#fff}
.set-input{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--text);font-size:1rem;font-weight:600;text-align:center;width:100%;-webkit-appearance:none}
.set-input:focus{outline:none;border-color:var(--green)}
.log-btn{background:var(--green);border:none;border-radius:8px;color:#fff;font-size:0.8rem;font-weight:600;padding:7px 6px;cursor:pointer;width:100%;transition:all .15s}
.log-btn:active{transform:scale(0.95)}
.log-btn.done-btn{background:var(--s3);color:var(--muted)}
.logged-set{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#1D9E7515;border:1px solid #1D9E7530;border-radius:8px;margin-bottom:6px;font-size:0.85rem}
.logged-set .sv{font-weight:600;color:var(--green)}
.prev-box{margin:0 16px 12px;background:var(--s2);border-radius:10px;padding:10px 12px}
.prev-title{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.prev-set{font-size:0.82rem;color:#aaa}
.injury-alert{margin:10px 16px;background:#e0505015;border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:8px 12px;font-size:0.78rem;color:#f08080}
.upcoming-ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);opacity:.5}
.upcoming-ex:last-child{border:none}
.upcoming-ex .ex-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.bottom-actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px}
.rest-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.rest-circle{width:190px;height:190px;border-radius:50%;border:3px solid var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;position:relative}
.rest-circle svg{position:absolute;top:-2px;left:-2px;width:198px;height:198px;transform:rotate(-90deg)}
.rest-time{font-size:3.2rem;font-weight:700;line-height:1}
.rest-label{font-size:0.8rem;color:var(--muted);margin-top:4px}
.next-up{background:var(--s2);border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:left;width:100%}
.dispatch-box{background:var(--s1);border:1px solid var(--green);border-radius:12px;padding:14px;font-family:'Courier New',monospace;font-size:0.78rem;color:#7fff9a;line-height:1.9;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}

/* WARM-UP / COOL-DOWN / REST DAY */
.phase-screen{padding:16px;max-width:480px;margin:0 auto}
.phase-title{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.phase-subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:18px}
.phase-section{margin-bottom:20px}
.phase-section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.check-item.checked{background:#1D9E7512;border-color:#1D9E7540}
.check-item:active{transform:scale(0.98)}
.check-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all .2s}
.check-item.checked .check-circle{background:var(--green);border-color:var(--green)}
.check-info{flex:1}
.check-name{font-size:0.9rem;font-weight:600;margin-bottom:2px}
.check-item.checked .check-name{color:var(--muted);text-decoration:line-through}
.check-detail{font-size:0.75rem;color:var(--muted);line-height:1.4}
.rest-day-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.rest-day-header{font-size:0.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.rest-type-btn{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.rest-type-btn:active{transform:scale(0.98)}
.rest-type-btn.selected{border-color:var(--amber);background:#f0a03015}
.injury-rehab-note{background:#e0505015;border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:10px 12px;font-size:0.78rem;color:#f08080;margin-bottom:14px;line-height:1.6}

/* SETTINGS OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.overlay-card{background:var(--s1);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;border-top:1px solid var(--border)}
.api-input{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:0.85rem;width:100%;margin:8px 0;font-family:'Courier New',monospace}
.api-input:focus{outline:none;border-color:var(--green)}
.settings-btn{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px}

/* HUMAN FIGURE ANIMATIONS */
@keyframes bench-rep{0%,100%{transform:translateY(0px)}45%{transform:translateY(-22px)}55%{transform:translateY(-22px)}}
@keyframes squat-rep{0%,100%{transform:scaleY(1) translateY(0px)}45%{transform:scaleY(.72) translateY(16px)}55%{transform:scaleY(.72) translateY(16px)}}
@keyframes pullup-rep{0%,100%{transform:translateY(12px)}45%{transform:translateY(-6px)}55%{transform:translateY(-6px)}}
@keyframes press-rep{0%,100%{transform:translateY(0px)}45%{transform:translateY(-18px)}55%{transform:translateY(-18px)}}
@keyframes curl-rep{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-80deg)}55%{transform:rotate(-80deg)}}
@keyframes lateral-rep{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-50deg)}55%{transform:rotate(-50deg)}}
@keyframes lateral-rep-r{0%,100%{transform:rotate(0deg)}45%{transform:rotate(50deg)}55%{transform:rotate(50deg)}}
@keyframes hinge-rep{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-28deg)}55%{transform:rotate(-28deg)}}
@keyframes legcurl-rep{0%,100%{transform:rotate(0deg)}45%{transform:rotate(70deg)}55%{transform:rotate(70deg)}}
@keyframes pushdown-rep{0%,100%{transform:rotate(0deg)}45%{transform:rotate(55deg)}55%{transform:rotate(55deg)}}
@keyframes row-rep{0%,100%{transform:translateX(0)}45%{transform:translateX(-16px)}55%{transform:translateX(-16px)}}
@keyframes deadbug-arm{0%,100%{transform:rotate(0deg)}45%{transform:rotate(70deg)}55%{transform:rotate(70deg)}}
@keyframes deadbug-leg{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-70deg)}55%{transform:rotate(-70deg)}}
.anim-bench-bar{animation:bench-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
.anim-squat-body{animation:squat-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 55%}
.anim-pull-body{animation:pullup-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 15%}
.anim-press-bar{animation:press-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
.anim-curl-arm{animation:curl-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 8%}
.anim-lat-l{animation:lateral-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 8%}
.anim-lat-r{animation:lateral-rep-r 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 8%}
.anim-hinge{animation:hinge-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 55%}
.anim-legcurl{animation:legcurl-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 5%}
.anim-pushdown{animation:pushdown-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 5%}
.anim-row{animation:row-rep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.anim-db-arm{animation:deadbug-arm 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.anim-db-leg{animation:deadbug-leg 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
</style>
</head>

<div id="app"></div>
<script>
// ─── AUDIO DING ───────────────────────────────────────────────────────────
function playDing(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    [[880,.0],[1100,.13],[1320,.26]].forEach(([f,t])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(0,ac.currentTime+t);
      g.gain.linearRampToValueAtTime(.35,ac.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.45);
      o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.5);
    });
  }catch(e){}
}

// ─── SKIN / COLOURS ───────────────────────────────────────────────────────

'shoulder-press': `<svg viewBox="0 0 130 150" width="130" height="150">

// ─── ExerciseDB GIF FETCH ──────────────────────────────────────────────────
async function fetchGif(exName,exId){
  if(!S.apiKey) return null;
  if(S.gifCache[exId]) return S.gifCache[exId];
  const cleanName=exName.split('(')[0].trim().toLowerCase();
  const target=`https://exercisedb.p.rapidapi.com/exercises/name/${encodeURIComponent(cleanName)}?limit=1`;
  const headers={'X-RapidAPI-Key':S.apiKey,'X-RapidAPI-Host':'exercisedb.p.rapidapi.com'};
  // Three proxy options — try direct (works on HTTPS), then two fallbacks for file:// origin
  const proxies=[
    ()=>fetch(target,{headers}),
    ()=>fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,{headers}),
    ()=>fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`,{headers})
  ];
  let res=null;
  for(const tryFetch of proxies){
    try{
      res=await tryFetch();
      if(res.ok) break; // got a good response, stop trying
    }catch(e){ res=null; } // CORS error or network — try next proxy
  }
  if(!res||!res.ok){
    const code=res?res.status:0;
    S.gifErrors[exId]=code===403?'Key issue':code===429?'Rate limit':code?`HTTP ${code}`:'No connection';
    render();return null;
  }
  try{
    const data=await res.json();
    if(Array.isArray(data)&&data.length&&data[0].gifUrl){
      S.gifCache[exId]=data[0].gifUrl;
      delete S.gifErrors[exId];
      saveGifCache();render();
      return data[0].gifUrl;
    }
    // API returned non-array (error object) or empty — don't show badge at all
    delete S.gifErrors[exId];
    render();return null;
  }catch(e){
    delete S.gifErrors[exId];
    render();return null;
  }
}

// ─── WARM-UP ───────────────────────────────────────────────────────────────

  const day=WK[S.day];
  const allItems=[...WARMUP_GENERAL,...WARMUP_REHAB];
  const checked=S.warmupChecked.size;
  const total=allItems.length;
  const pct=Math.round(checked/total*100);
  const mkItem=(item)=>{
    const done=S.warmupChecked.has(item.id);
    return`<div class="check-item${done?' checked':''}" onclick="toggleWarmup('${item.id}')">
      <div class="check-circle">${done?'✓':''}</div>
      <div class="check-info"><div class="check-name">${item.name}</div><div class="check-detail">${item.detail}</div></div>

  };
  return`<div class="top-bar">
  <div><div style="font-size:0.88rem;font-weight:600">Warm-Up · Day ${S.day} · ${day.name}</div><div style="font-size:0.72rem;color:var(--muted)">${checked}/${total} complete</div></div>

// ─── COOL-DOWN ─────────────────────────────────────────────────────────────

  const day=WK[S.day];
  const isLower=S.day==='B'||S.day==='D';
  const items=isLower?COOLDOWN.lower:COOLDOWN.upper;
  const checked=S.cooldownChecked.size;
  const total=items.length;
  const pct=Math.round(checked/total*100);
  const mkItem=(item)=>{
    const done=S.cooldownChecked.has(item.id);
    return`<div class="check-item${done?' checked':''}" onclick="toggleCooldown('${item.id}')">
      <div class="check-circle">${done?'✓':''}</div>
      <div class="check-info"><div class="check-name">${item.name}</div><div class="check-detail">${item.detail}</div></div>
    </div>`;
  };
  return`<div class="top-bar">
  <div><div style="font-size:0.88rem;font-weight:600">Cool-Down · Day ${S.day} · ${day.name}</div><div style="font-size:0.72rem;color:var(--muted)">${checked}/${total} complete</div></div>
  <button class="btn btn-outline btn-sm" onclick="finishAndSave()">Skip →</button>
</div>
<div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:var(--amber)"></div></div>

    <div class="phase-section-title"><span>${isLower?'Lower Body':'Upper Body'} Stretching <span style="color:var(--amber)">5–7 min</span></span><span style="color:var(--muted)">${checked}/${total}</span></div>

// ─── COMPLETE ──────────────────────────────────────────────────────────────
function renderComplete(){
  const sess=S.history[S.history.length-1];
  const totalSets=Object.values(sess.sets).reduce((a,s)=>a+s.length,0);
  const totalVol=Object.values(sess.sets).reduce((a,s)=>a+s.reduce((b,x)=>b+x.weight*x.reps,0),0);
  let dispatch=`DISPATCH | Day ${sess.day} | Week ${sess.week} | ${fmt(sess.date)}\n`;
  WK[sess.day].exercises.forEach(e=>{
    const sets=sess.sets[e.id]||[];
    dispatch+=`${e.name}: ${sets.length?sets.map(s=>`${s.weight}kg×${s.reps}`).join(', '):'skipped'}\n`;
  });
  dispatch+=`\nTotal volume: ${totalVol.toLocaleString()}kg | Sets: ${totalSets}\nEnergy: _/10 | Back pain: _/10 | Notes: ___`;
  return`<div class="top-bar"><div style="font-size:1rem;font-weight:700">Workout Complete 🏆</div></div>
<div style="padding:16px">
  <div style="text-align:center;padding:24px 0 16px">
    <div style="font-size:3rem">🔥</div>
    <div style="font-size:1.4rem;font-weight:700;margin-top:8px">Day ${sess.day} Done!</div>
    <div style="color:var(--muted);font-size:0.85rem;margin-top:4px">${fmt(sess.date)} · Week ${sess.week}</div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
      <div style="background:var(--s2);border-radius:12px;padding:12px 18px;text-align:center"><div style="font-size:1.4rem;font-weight:700;color:var(--green)">${totalSets}</div><div style="font-size:0.72rem;color:var(--muted)">Sets logged</div></div>
      <div style="background:var(--s2);border-radius:12px;padding:12px 18px;text-align:center"><div style="font-size:1.4rem;font-weight:700;color:var(--blue)">${totalVol.toLocaleString()}</div><div style="font-size:0.72rem;color:var(--muted)">Volume (kg)</div></div>

  </div>
  <div class="card-title">Your Dispatch — paste this to Claude on Sunday</div>

  <button class="btn btn-outline" style="margin-bottom:10px" onclick="copyDispatch()">📋 Copy Dispatch</button>
  <button class="btn btn-green" onclick="goHome()">Back to Home</button>
</div>`;
}

  const k=(document.getElementById('api-key-input').value||S.apiKey).trim();
  const el=document.getElementById('api-test-result');
  if(!k){if(el)el.innerHTML='<span style="color:var(--amber)">Enter a key first</span>';return;}
  if(el)el.innerHTML='<span style="color:var(--muted)">Testing…</span>';
  const target='https://exercisedb.p.rapidapi.com/exercises/name/bench%20press?limit=1';
  const headers={'X-RapidAPI-Key':k,'X-RapidAPI-Host':'exercisedb.p.rapidapi.com'};
  const proxies=[
    ()=>fetch(target,{headers}),
    ()=>fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,{headers}),
    ()=>fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`,{headers})
  ];
  let res=null;
  for(const tryFetch of proxies){
    try{res=await tryFetch();if(res.ok)break;}catch(e){res=null;}
  }
  if(!res){
    if(el)el.innerHTML='<span style="color:var(--red)">❌ Network error — check connection</span>';
    return;
  }
  if(res.ok){
    try{
      const d=await res.json();
      if(Array.isArray(d)&&d.length&&d[0].gifUrl){
        if(el)el.innerHTML='<span style="color:var(--green)">✅ Key works! GIFs loading now.</span>';
      } else {
        if(el)el.innerHTML='<span style="color:var(--amber)">⚠️ API connected — check ExerciseDB subscription</span>';
      }
    }catch(e){if(el)el.innerHTML='<span style="color:var(--amber)">⚠️ API responded but data unreadable</span>';}
  } else if(res.status===403){
    if(el)el.innerHTML='<span style="color:var(--red)">❌ 403 — Key invalid or wrong API subscribed</span>';
  } else if(res.status===429){
    if(el)el.innerHTML='<span style="color:var(--amber)">⚠️ Rate limit — try again in a minute</span>';
  } else {
    if(el)el.innerHTML=`<span style="color:var(--red)">❌ Error ${res.status}</span>`;
  }
}
function pasteApiKey(){
  navigator.clipboard.readText().then(t=>{
    const el=document.getElementById('api-key-input');
    if(el){el.value=t.trim();el.focus();}
  }).catch(()=>{
    // Clipboard permission denied — focus the field so user can Ctrl+V
    const el=document.getElementById('api-key-input');
    if(el){el.focus();el.select();}
    alert('Click the field and press Ctrl+V (or Cmd+V on Mac) to paste.');
  });
}
function clearApiKey(){
  S.apiKey='';localStorage.removeItem('eli_rapid_key');
  S.gifCache={};localStorage.removeItem('eli_gif_cache');
  S.showSettings=false;render();
}
function goToWarmup(){
  S.warmupChecked=new Set();S.screen='warmup';render();
}
function startWorkout(){
  S.exIdx=0;S.loggedSets={};S.workoutStart=Date.now();S.screen='workout';
  render();
  loadGif(curEx());
}
function toggleWarmup(id){
  S.warmupChecked.has(id)?S.warmupChecked.delete(id):S.warmupChecked.add(id);
  render();
}
function toggleCooldown(id){
  S.cooldownChecked.has(id)?S.cooldownChecked.delete(id):S.cooldownChecked.add(id);
  render();
}
function toggleRestDay(id){
  S.restDayChecked.has(id)?S.restDayChecked.delete(id):S.restDayChecked.add(id);
  render();
}
function openRestDay(type){S.restDayType=type;S.restDayChecked=new Set();S.screen='restday';render();}
function switchRestDay(type){S.restDayType=type;S.restDayChecked=new Set();render();}
function finishAndSave(){S.screen='complete';render();}
function loadGif(ex){ /* GIF loading disabled — ExerciseDB v2 removed gifUrl field */ }
function getAllExercises(){
  return Object.values(WK).flatMap(d=>d.exercises);
}
async function preloadAllGifs(){
  if(!S.apiKey){alert('Save your API key first!');return;}
  const btn=document.getElementById('preload-btn');
  if(btn){btn.textContent='⏳ Loading…';btn.disabled=true;}
  const all=getAllExercises();
  let loaded=0;
  for(const ex of all){
    if(!S.gifCache[ex.id]){
      await fetchGif(ex.name,ex.id);
      loaded++;
      const b=document.getElementById('preload-btn');
      if(b) b.textContent=`⏳ Loading ${loaded}/${all.filter(e=>!S.gifCache[e.id]).length+loaded}…`;
      await new Promise(r=>setTimeout(r,300)); // small delay to be nice to the API
    }
  }
  render(); // refresh cache status bar
  const b=document.getElementById('preload-btn');
  if(b){b.textContent='✅ All GIFs Cached!';b.disabled=false;}
}
function logSet(i){
  const ex=curEx();
  const w=parseFloat(document.getElementById('w-'+i).value);
  const r=parseInt(document.getElementById('r-'+i).value);
  if(!w||!r){alert('Enter weight and reps!');return;}
  if(!S.loggedSets[ex.id]) S.loggedSets[ex.id]=[];
  S.loggedSets[ex.id][i]={weight:w,reps:r};
  const logged=S.loggedSets[ex.id].filter(Boolean).length;
  render();
  if(logged<ex.sets) startRest(ex.rest);
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
}
function startRest(sec){
  S.restLeft=sec;S.restTotal=sec;S.screen='rest';render();
  S.restInterval=setInterval(()=>{
    S.restLeft--;
    const d=document.getElementById('rest-display');
    if(d) d.textContent=S.restLeft;
    const c=document.getElementById('rest-circ');
    if(c){const circ=Math.PI*2*91;c.style.strokeDashoffset=circ*(1-S.restLeft/S.restTotal);}
    if(S.restLeft<=0){
      clearInterval(S.restInterval);
      playDing();
      try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}
      S.screen='workout';render();
    }
  },1000);
}
function skipRest(){clearInterval(S.restInterval);S.screen='workout';render();}
function nextEx(){
  if(S.exIdx>=totalEx()-1){endWorkout();return;}
  S.exIdx++;render();window.scrollTo(0,0);
  loadGif(curEx());
}
function prevEx(){if(S.exIdx>0){S.exIdx--;render();window.scrollTo(0,0);}}
function endWorkout(){
  clearInterval(S.restInterval);
  const sess={day:S.day,week:S.week,date:Date.now(),sets:JSON.parse(JSON.stringify(S.loggedSets))};
  S.history.push(sess);save();
  S.cooldownChecked=new Set();
  S.screen='cooldown';render();
}
function goHome(){S.screen='home';S.loggedSets={};S.exIdx=0;render();}
function copyDispatch(){
  const t=document.getElementById('dispatch-text').textContent;
  navigator.clipboard.writeText(t).then(()=>alert('Dispatch copied! Paste to Claude for your Sunday check-in.')).catch(()=>{});
}
// Auto-persist API key to localStorage on load
if(S.apiKey) localStorage.setItem('eli_rapid_key', S.apiKey);
render();
</script>
